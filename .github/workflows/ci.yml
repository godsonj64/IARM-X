name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q iarmx scripts tests
      - run: pytest -q
      - run: python scripts/smoke_test.py
      - run: python scripts/count_params.py --config configs/iarmx_1.3b.yaml --meta
