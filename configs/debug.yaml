model:
  vocab_size: 50260
  dim: 256
  n_layers: 4
  n_heads: 4
  ffn_hidden: 768
  max_seq_len: 512
  dropout: 0.0
  n_operators: 4
  operator_rank: 8
  local_kernel: 5
  attention_every: 4
  fast_memory_rank: 16
  gradient_checkpointing: false
  use_sdpa: true

data:
  stage: pretrain
  tokenizer: gpt2
  dataset: wikitext
  dataset_config: wikitext-2-raw-v1
  split: train
  seq_len: 128
  streaming: false

training:
  seed: 42
  micro_batch_size: 2
  grad_accum: 2
  max_steps: 100
  lr: 0.0003
  min_lr: 0.00003
  warmup_steps: 10
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  precision: bf16
  compile: false
  log_every: 1
  save_every: 50
  output_dir: checkpoints/debug
