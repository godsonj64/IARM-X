# IARM-X ~100M pretraining configuration.
# Verified with GPT-2 + 3 control tokens: 100,202,256 trainable parameters.
model:
  vocab_size: 50260
  dim: 768
  n_layers: 8
  n_heads: 12
  ffn_hidden: 1984
  max_seq_len: 2048
  dropout: 0.05
  rope_theta: 10000.0
  n_operators: 4
  operator_rank: 16
  local_kernel: 5
  attention_every: 4       # R,R,R,A,R,R,R,A = exact 3:1 recurrent:attention
  fast_memory_rank: 32
  memory_decay_min: 0.90
  memory_decay_max: 0.9999
  attention_bias_from_importance: true
  importance_scale_init: 0.10
  tie_embeddings: true
  gradient_checkpointing: true
  use_sdpa: true

data:
  stage: pretrain
  tokenizer: gpt2
  dataset: parquet
  dataset_config: null
  data_files:
    train: "data/raw/fineweb-edu-10bt/sample/10BT/*.parquet"
  split: train
  seq_len: 512
  streaming: true
  pack: true

training:
  seed: 42
  micro_batch_size: 8
  grad_accum: 16
  target_tokens: 10000000000
  lr: 0.0006
  min_lr: 0.00006
  warmup_steps: 2000
  betas: [0.9, 0.95]
  weight_decay: 0.05
  grad_clip: 1.0
  precision: bf16
  compile: true
  num_workers: 2
  log_every: 10
  save_every: 1000
  output_dir: checkpoints/iarmx-100m-pretrain
